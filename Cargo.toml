[package]
name = "wmailor"
version = "0.1.0"
edition = "2024"
description = "Text-based IMAP admin client — raw source only, Turbo Vision menus"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
directories = "5"
encoding_rs = "0.8"
image = "0.25"
imap = { version = "2", default-features = false, features = ["tls"] }
mail-parser = "0.11"
mailparse = "0.15"
native-tls = { version = "0.2", features = ["vendored"] }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
